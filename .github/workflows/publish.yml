# Publishes the package to npm on every version tag push, with a provenance statement.
#
# npm authenticates this workflow through OIDC Trusted Publishing, set up in the package
# settings on npmjs.com for ANLTD/chunker and publish.yml. No npm token is stored here.
# Trusted Publishing can only be set up on a package that exists, so 0.1.0 is published by hand.
#
# Release: bump "version" in package.json, add the entry to CHANGELOG.md, commit, then
#   git tag -a 0.2.0 -m "Release 0.2.0" && git push origin main 0.2.0

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in package.json"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run tests
        run: 'npm test'

      # prepublishOnly builds dist right before packing.
      - name: Publish
        run: 'npm publish'
        env:
          NPM_CONFIG_PROVENANCE: 'true'